services:
  - type: web
    name: orkun-smartlead-ai
    runtime: python
    plan: starter
    numInstances: 1
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --workers 1 --threads 4 --timeout 60 --bind 0.0.0.0:$PORT baslat:uygulama
    healthCheckPath: /health
    disk:
      name: leads-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        value: /var/data/leads.db
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_API_TOKEN
        generateValue: true
      - key: GROQ_API_KEY
        sync: false
      - key: AI_PROVIDER
        value: groq
      - key: AI_MODEL
        value: llama-3.1-8b-instant
      - key: CORS_ORIGINS
        sync: false
